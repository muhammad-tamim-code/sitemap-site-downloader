[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-site-downloader"
version = "0.1.0"
description = "Download sitemap pages, mirror same-site assets, and export a CSV inventory."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Muhammad Tamim"}]

[project.scripts]
sitemap-site-downloader = "sitemap_site_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
